<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Все публикации</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Все публикации</h1>
    <a href="/posts/new" class="btn btn-primary">Создать пост</a>
</div>

<div class="list-group">
    <div th:each="post : ${posts}" class="list-group-item d-flex justify-content-between align-items-center mb-2">
        <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}" class="text-decoration-none fw-bold"></a>
        <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
        </form>
    </div>
</div>
</body>
</html>
