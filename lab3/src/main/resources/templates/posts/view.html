<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${post.title}">Просмотр поста</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<div class="mb-4">
    <h1 th:text="${post.title}"></h1>
    <p class="lead" th:text="${post.content}"></p>
    <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-sm btn-warning">Редактировать пост</a>
    <a href="/posts" class="btn btn-sm btn-secondary">К списку</a>
</div>

<hr>

<h3>Комментарии</h3>
<div class="mb-3" th:each="comment : ${comments}">
    <div class="card mb-2">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <strong th:text="${comment.author}"></strong>:
                <span th:text="${comment.text}"></span>
            </div>
            <form th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post">
                <input type="hidden" name="postId" th:value="${post.id}">
                <button type="submit" class="btn btn-sm btn-outline-danger">x</button>
            </form>
        </div>
    </div>
</div>

<h4 class="mt-4">Добавить комментарий</h4>
<form th:action="@{/comments/post/{postId}(postId=${post.id})}" th:object="${commentCreateDto}" method="post" class="col-md-6 mb-5">
    <div class="mb-2">
        <input type="text" th:field="*{author}" class="form-control" placeholder="Ваше имя" th:classappend="${#fields.hasErrors('author')} ? 'is-invalid'">
        <div class="invalid-feedback" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></div>
    </div>
    <div class="mb-2">
        <textarea th:field="*{text}" class="form-control" placeholder="Текст комментария" rows="2" th:classappend="${#fields.hasErrors('text')} ? 'is-invalid'"></textarea>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('text')}" th:errors="*{text}"></div>
    </div>
    <button type="submit" class="btn btn-primary btn-sm">Отправить</button>
</form>
</body>
</html>
